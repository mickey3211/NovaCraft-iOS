# Free Codemagic personal-account build. No Apple Developer Program is needed
# for compiling an UNSIGNED IPA, and no certificates are stored in CI.
# Sign locally using iPASide (all embedded frameworks/dylibs must be signed).
workflows:
  novacraft-ios-free:
    name: NovaCraft iOS - bezplatny IPA (Java 21 + LWJGL)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "16.4"
    scripts:
      - name: Zbuduj niepodpisany NovaCraft IPA
        script: |
          bash scripts/build-ios-codemagic.sh
    artifacts:
      - dist/*.ipa
      - dist/ios-native-signing-inventory.txt
      - dist/build-logs/*.log

name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch verified real OpenJDK iOS framework and Java modules
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/novajdk" Vendor JavaRuntime/lib
          cd "$RUNNER_TEMP/novajdk"
          fetch() {
            local name="$1" sha="$2"
            curl --fail --location --retry 3 -o "$name" "https://github.com/openjdk-mobile/ios-tools/releases/download/snapshot/$name"
            echo "$sha  $name" | shasum -a 256 -c -
          }
          fetch OpenJDK.xcframework.zip ae8e22142e45e5c1e9e8e3541829f3cc00584658eb21eeeb0d3612e3fbaf7c9f
          fetch java_bundle-device.zip 37387a48bdd7f1ce1d3a38e88356e61288673c91b42ef27cf1b71d27e05cc54a
          unzip -q OpenJDK.xcframework.zip
          unzip -q java_bundle-device.zip
          test -s java_bundle-device/lib/modules
          ditto OpenJDK.xcframework "$GITHUB_WORKSPACE/Vendor/OpenJDK.xcframework"
          ditto java_bundle-device/lib/modules "$GITHUB_WORKSPACE/JavaRuntime/lib/modules"
          echo "Linked static iOS OpenJDK and bundled java modules; runtime major not verified as Java 21."

      - name: Prepare verified native Java 21 iOS runtime
        run: bash scripts/build-vendor-ios-jre21.sh

      - name: Generate NovaCraft home screen icon
        run: |
          python3 -m venv "$RUNNER_TEMP/novacraft-icon-venv"
          "$RUNNER_TEMP/novacraft-icon-venv/bin/python" -m pip install pillow
          "$RUNNER_TEMP/novacraft-icon-venv/bin/python" scripts/generate-app-icon.py
          test -s Native/NovaCraft/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for physical iOS devices (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project NovaCraft.xcodeproj \
            -scheme NovaCraft \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate optional Java runtime
        run: bash scripts/package-java-runtime.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NovaCraft.app"

      - name: Validate optional LWJGL bridge
        run: bash scripts/package-lwjgl-bridge.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NovaCraft.app"

      - name: Embed optional upstream iOS LWJGL libraries
        run: bash scripts/package-upstream-lwjgl-ios.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NovaCraft.app"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NovaCraft.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/NovaCraft.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/dist/NovaCraft-UNSIGNED.ipa" Payload
          test -s "$GITHUB_WORKSPACE/dist/NovaCraft-UNSIGNED.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-unsigned-iPhone-IPA
          path: dist/NovaCraft-UNSIGNED.ipa
          retention-days: 7
          if-no-files-found: error

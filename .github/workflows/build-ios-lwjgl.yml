name: Build iOS LWJGL components (upstream source)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-lwjgl.yml'
      - 'Native/NovaCraft/**'
      - 'scripts/**'
      - 'project.yml'
  workflow_dispatch:
    inputs:
      lwjgl_commit:
        description: "Reviewed 40-character commit SHA of PojavLauncherTeam/lwjgl3"
        required: false
        type: string

permissions:
  contents: read

jobs:
  lwjgl:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned revision
        env:
          REV: ${{ inputs.lwjgl_commit || '39272d4d0ca119379024e3ca7207699fd3fce237' }}
        run: |
          [[ "$REV" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Full git commit required"; exit 1; }
      - name: Install required Java 8 build JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build dependencies
        run: |
          brew install ant wget
      - name: Checkout iOS LWJGL fork
        env:
          REV: ${{ inputs.lwjgl_commit || '39272d4d0ca119379024e3ca7207699fd3fce237' }}
        run: |
          set -euo pipefail
          git clone https://github.com/PojavLauncherTeam/lwjgl3.git "$RUNNER_TEMP/lwjgl3"
          git -C "$RUNNER_TEMP/lwjgl3" checkout --detach "$REV"
      - name: Build native iOS LWJGL and Java jars
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lwjgl3"
          # libffi 3.4.6 source's assembly triggers an Xcode 16.4 invalid CFI
          # error. Prefer the separate iOS-arm64 libffi build, SHA256 pinned.
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/libffi-ios.zip" \
            "https://github.com/openjdk-mobile/ios-tools/releases/download/libffi-build/libffi-ios.zip"
          echo "4f39fd1d53fbd69d1bdbd915413077d130daa3f6792d1b3a03a690a9cbd4dea3  $RUNNER_TEMP/libffi-ios.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/libffi-content"
          unzip -q "$RUNNER_TEMP/libffi-ios.zip" -d "$RUNNER_TEMP/libffi-content"
          find "$RUNNER_TEMP/libffi-content" -type f -print
          library="$(find "$RUNNER_TEMP/libffi-content" -type f -name 'libffi.a' -print -quit)"
          test -n "$library"
          mkdir -p bin/libs/native/macos/arm64/org/lwjgl
          cp "$library" bin/libs/native/macos/arm64/org/lwjgl/libffi.a
          # Upstream shaderc nightly URL now 404; vanilla OpenGL Minecraft
          # does not need Vulkan shaderc. Disable only shaderc, not LWJGL core.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ci_build_ios.bash")
          s = p.read_text()
          s = s.replace('wget -nc "https://nightly.link/PojavLauncherTeam/shaderc/workflows/ios/main/libshaderc.zip"', ': # upstream shaderc nightly unavailable')
          s = s.replace('unzip -o libshaderc.zip -d $LWJGL_NATIVE/shaderc', ': # no shaderc')
          s = s.replace('rm $LWJGL_NATIVE/shaderc/libshaderc_shared.1.dylib', ': # no shaderc')
          s = s.replace('mv $LWJGL_NATIVE/shaderc/libshaderc_shared.dylib $LWJGL_NATIVE/shaderc/libshaderc.dylib', ': # no shaderc')
          s = s.replace('cp $LWJGL_NATIVE/shaderc/libshaderc.dylib bin/out/', ': # no shaderc')
          s = s.replace('  -Dbinding.assimp=false \\', '  -Dbinding.assimp=false \\\n  -Dbinding.shaderc=false \\')
          p.write_text(s)
          PY
          export JAVA8_HOME="$JAVA_HOME"
          SKIP_LIBFFI=1 bash ci_build_ios.bash
          test -d bin/RELEASE
          test -d bin/out
          mkdir -p "$RUNNER_TEMP/lwjgl-artifact/jars" "$RUNNER_TEMP/lwjgl-artifact/native"
          cp -R bin/RELEASE/. "$RUNNER_TEMP/lwjgl-artifact/jars/"
          cp -R bin/out/. "$RUNNER_TEMP/lwjgl-artifact/native/"
          find "$RUNNER_TEMP/lwjgl-artifact/native" -type f -exec file {} \;
      - name: Stage compiled iOS LWJGL for NovaCraft
        run: |
          set -euo pipefail
          mkdir -p Vendor/LWJGL-iOS/jars Vendor/LWJGL-iOS/native
          find "$RUNNER_TEMP/lwjgl-artifact/jars" -type f -name '*.jar' \
            ! -name '*-natives-*' ! -name '*-sources.jar' \
            -exec cp {} Vendor/LWJGL-iOS/jars/ \;
          cp "$RUNNER_TEMP/lwjgl-artifact/native/"*.dylib Vendor/LWJGL-iOS/native/
          test -s Vendor/LWJGL-iOS/native/liblwjgl.dylib
          test -n "$(find Vendor/LWJGL-iOS/jars -maxdepth 1 -name '*.jar' -print -quit)"
          ls -lh Vendor/LWJGL-iOS/native/
          ls Vendor/LWJGL-iOS/jars/

      - name: Install XcodeGen for integrated IPA
        run: brew install xcodegen

      - name: Bundle verified iOS Java21 and OpenJDK resources
        run: |
          set -euo pipefail
          bash scripts/build-vendor-ios-jre21.sh
          mkdir -p "$RUNNER_TEMP/novajdk" Vendor JavaRuntime/lib
          cd "$RUNNER_TEMP/novajdk"
          curl --fail --location --retry 3 -o OpenJDK.xcframework.zip \
            https://github.com/openjdk-mobile/ios-tools/releases/download/snapshot/OpenJDK.xcframework.zip
          echo "ae8e22142e45e5c1e9e8e3541829f3cc00584658eb21eeeb0d3612e3fbaf7c9f  OpenJDK.xcframework.zip" | shasum -a 256 -c -
          curl --fail --location --retry 3 -o java_bundle-device.zip \
            https://github.com/openjdk-mobile/ios-tools/releases/download/snapshot/java_bundle-device.zip
          echo "37387a48bdd7f1ce1d3a38e88356e61288673c91b42ef27cf1b71d27e05cc54a  java_bundle-device.zip" | shasum -a 256 -c -
          unzip -q OpenJDK.xcframework.zip
          unzip -q java_bundle-device.zip
          test -s java_bundle-device/lib/modules
          ditto OpenJDK.xcframework "$GITHUB_WORKSPACE/Vendor/OpenJDK.xcframework"
          ditto java_bundle-device/lib/modules "$GITHUB_WORKSPACE/JavaRuntime/lib/modules"

      - name: Compile NovaCraft with iOS JVM and LWJGL
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/novacraft-icon-venv"
          "$RUNNER_TEMP/novacraft-icon-venv/bin/python" -m pip install pillow
          "$RUNNER_TEMP/novacraft-icon-venv/bin/python" scripts/generate-app-icon.py
          xcodegen generate
          xcodebuild -project NovaCraft.xcodeproj -scheme NovaCraft \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NovaCraft.app"
          bash scripts/package-java-runtime.sh "$APP"
          bash scripts/package-upstream-lwjgl-ios.sh "$APP"
          test -s "$APP/Frameworks/NovaJava21.framework/NovaJava21"
          test -s "$APP/Frameworks/liblwjgl.dylib"
          test -s "$APP/LWJGL-iOS/lwjgl.jar"
          mkdir -p "$RUNNER_TEMP/integrated-ipa/Payload" dist
          ditto "$APP" "$RUNNER_TEMP/integrated-ipa/Payload/NovaCraft.app"
          cd "$RUNNER_TEMP/integrated-ipa"
          zip -qry "$GITHUB_WORKSPACE/dist/NovaCraft-Java21-LWJGL-UNSIGNED.ipa" Payload
          test -s "$GITHUB_WORKSPACE/dist/NovaCraft-Java21-LWJGL-UNSIGNED.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Java21-LWJGL-unsigned-IPA-test
          path: dist/NovaCraft-Java21-LWJGL-UNSIGNED.ipa
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-ios-lwjgl-components-not-IPA
          path: ${{ runner.temp }}/lwjgl-artifact
          if-no-files-found: error
          retention-days: 7

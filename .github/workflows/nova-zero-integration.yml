name: Build real NovaCraft SwiftUI with statically linked Zero JVM (developer test)
on:
  push:
    branches: [work/complete-zero-runtime]
    paths:
      - ".github/workflows/nova-zero-integration.yml"
      - "ZeroIntegration/**"
      - "Native/NovaCraft/**"
      - "project.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-zero-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Java compiler and XcodeGen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      - name: Install XcodeGen and generate NovaCraft icon
        run: |
          set -euo pipefail
          brew install xcodegen autoconf make
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/python" -m pip install --disable-pip-version-check pillow
          "$RUNNER_TEMP/icons/bin/python" scripts/generate-app-icon.py
      - name: Restore matching macOS build tools
        id: host-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nova-host-jdk
          key: nova-host-jdk-v1-c1ed06aaef34c8dccf71e236d1ffa20918a77cfb-${{ runner.os }}-${{ runner.arch }}
      - name: Build complete matching Zero runtime from pinned OpenJDK sources
        run: |
          set -euo pipefail
          bash scripts/build-nova-zero-runtime.sh 2>&1 | tee "$RUNNER_TEMP/zero-runtime-build.log"
      - name: Cache successfully produced host tools even if iOS build fails
        if: always() && steps.host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nova-host-jdk
          key: nova-host-jdk-v1-c1ed06aaef34c8dccf71e236d1ffa20918a77cfb-${{ runner.os }}-${{ runner.arch }}
      - name: Preserve built runtime for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Zero-Runtime-Source-Build
          path: |
            ZeroIntegration/OpenJDK.xcframework
            ZeroIntegration/runtime-native-symbols.xcconfig
            ZeroIntegration/Resources/lib
            ZeroIntegration/Resources/runtime-modules.txt
            ZeroIntegration/Resources/RuntimeLicenses
          retention-days: 14
      - name: Compile original Java smoke test to Java21 class bytecode
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes" ZeroIntegration/Resources
          javac --release 21 -d "$RUNNER_TEMP/classes" ZeroIntegration/Java/dev/novacraft/zero/NovaZeroSmoke.java
          javap -verbose "$RUNNER_TEMP/classes/dev/novacraft/zero/NovaZeroSmoke.class" | grep -F 'major version: 65'
          jar cf ZeroIntegration/Resources/NovaZeroSmoke.jar -C "$RUNNER_TEMP/classes" .
      - name: Compile original NovaCraft with static Zero VM
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project NovaCraft.xcodeproj -scheme NovaCraft \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NovaDerived" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/nova-zero-xcode.log"
      - name: Verify and assemble independent test IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NovaDerived/Build/Products/Release-iphoneos/NovaCraft.app"
          test -s "$APP/NovaCraft"
          test -s "$APP/NovaZeroSmoke.jar"
          test -s "$APP/lib/lib/modules"
          ! find "$APP" -name 'libjvm.dylib' | grep -q .
          mkdir -p "$RUNNER_TEMP/ZeroIntegrated/Payload" dist
          ditto "$APP" "$RUNNER_TEMP/ZeroIntegrated/Payload/NovaCraft.app"
          (cd "$RUNNER_TEMP/ZeroIntegrated" && zip -qry "$GITHUB_WORKSPACE/dist/NovaCraft-Zero-Integrated-UNSIGNED.ipa" Payload)
          python3 - <<'PY'
          import plistlib,zipfile
          with zipfile.ZipFile("dist/NovaCraft-Zero-Integrated-UNSIGNED.ipa") as z:
              assert z.testzip() is None
              names=set(z.namelist())
              base="Payload/NovaCraft.app/"
              assert base+"NovaZeroSmoke.jar" in names
              assert base+"lib/lib/modules" in names
              assert base+"lib/lib/tzdb.dat" in names
              assert base+"lib/lib/security/cacerts" in names
              assert base+"lib/conf/security/java.security" in names
              info=plistlib.loads(z.read(base+"Info.plist"))
              assert info["CFBundleVersion"]=="20"
              assert info["CFBundleIdentifier"]=="pl.novacraft.zero.integrated"
              assert info["CFBundleDisplayName"]=="NovaCraft Z-Dev"
              assert b"NOVA_ZERO_INTEGRATED_OK" in z.read(base+"NovaCraft")
              assert b"ZERO_READINESS_ERROR" in z.read(base+"NovaCraft")
              import io
              with zipfile.ZipFile(io.BytesIO(z.read(base+"NovaZeroSmoke.jar"))) as classes:
                  code=classes.read("dev/novacraft/zero/NovaZeroSmoke.class")
                  assert b"ZERO_ZIP_API_OK" in code
                  assert b"MINECRAFT_CLIENT_JAR" in code
                  assert b"ZERO_MODULE_" in code
                  assert b"ZERO_TIMEZONE_API_FAILED" in code
                  assert b"MINECRAFT_BASE_CLASS_HEADERS" in code
                  assert b"MINECRAFT_MODERN_ENTRYPOINT" in code
          PY
      - name: Store compiler logs when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Zero-Integration-Xcode-Errors
          path: |
            ${{ runner.temp }}/nova-zero-xcode.log
            ${{ runner.temp }}/zero-runtime-build.log
            ${{ runner.temp }}/nova-zero-source/mobile/build/*/configure.log
            ${{ runner.temp }}/nova-zero-source/mobile/build/*/make-support/failure-summary
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish actual Zero-integrated unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Zero-Integrated-UNSIGNED-IPA
          path: dist/NovaCraft-Zero-Integrated-UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14

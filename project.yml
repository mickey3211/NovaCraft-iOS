name: NovaCraft
options:
  bundleIdPrefix: pl.novacraft
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NovaCraft:
    type: application
    platform: iOS
    sources:
      - path: Native/NovaCraft
      - path: JavaRuntime/lib
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/OpenJDK.xcframework
        embed: false
        link: true
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.novacraft.launcher
        SWIFT_OBJC_BRIDGING_HEADER: Native/NovaCraft/NovaJNIInvoker.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Native/NovaCraft/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: -lc++

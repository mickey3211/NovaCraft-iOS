name: NovaCraft
options:
  bundleIdPrefix: pl.novacraft
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NovaCraft:
    type: application
    platform: iOS
    sources:
      - path: Native/NovaCraft
      - path: ZeroIntegration/Resources/NovaZeroSmoke.jar
        buildPhase: resources
      - path: ZeroIntegration/Resources/lib
        type: folder
        buildPhase: resources
      - path: ZeroIntegration/Resources/RuntimeLicenses
        type: folder
        buildPhase: resources
      - path: ZeroIntegration/Resources/runtime-modules.txt
        buildPhase: resources
    dependencies:
      - framework: ZeroIntegration/OpenJDK.xcframework
        embed: false
        link: true
      - sdk: libz.tbd
    configFiles:
      Debug: ZeroIntegration/runtime-native-symbols.xcconfig
      Release: ZeroIntegration/runtime-native-symbols.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.novacraft.zero.integrated
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Native/NovaCraft/NovaJNIInvoker.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Native/NovaCraft/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: "$(inherited) -lc++ $(NOVA_RUNTIME_SYMBOLS)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOVA_ZERO_INTEGRATION"
